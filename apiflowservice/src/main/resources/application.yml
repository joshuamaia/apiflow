spring:
  application:
    name: apiflowservice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apiflow}
    username: ${DB_USER:apiflow}
    password: ${DB_PASSWORD:apiflow}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 35m

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

flow:
  tracking:
    enabled: true
    include-paths:
      - /api/orders/**
      - /api/products/**
    exclude-paths:
      - /api/flow/**
      - /api/demo/**
      - /actuator/**
    max-in-flight-traces: 500
    max-spans-per-trace: 200
    persistence-queue-capacity: 1000
    retention:
      max-traces: ${FLOW_RETENTION_MAX_TRACES:1000}
      max-age: ${FLOW_RETENTION_MAX_AGE:24h}
      cleanup-interval: 1m
  visualization:
    slow-threshold: ${FLOW_SLOW_THRESHOLD:250ms}
    sse-timeout: 30m
    replay-buffer-size: 1000
    max-subscribers: 100

logging:
  level:
    root: INFO
    br.com.joshua.apiflowservice: INFO
