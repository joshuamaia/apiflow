name: api-flow-visualizer

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apiflow}
      POSTGRES_USER: ${POSTGRES_USER:-apiflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apiflow}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the host on purpose (avoids clashing with a local PostgreSQL).
    # Uncomment to inspect the database from the host:
    # ports:
    #   - "55432:5432"
    restart: unless-stopped

  backend:
    build:
      context: ./apiflowservice
      additional_contexts:
        certs: ./docker/certs
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-apiflow}
      DB_USER: ${POSTGRES_USER:-apiflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-apiflow}
      SERVER_PORT: 8080
      FLOW_SLOW_THRESHOLD: ${FLOW_SLOW_THRESHOLD:-250ms}
      FLOW_RETENTION_MAX_TRACES: ${FLOW_RETENTION_MAX_TRACES:-1000}
      FLOW_RETENTION_MAX_AGE: ${FLOW_RETENTION_MAX_AGE:-24h}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./apiflowweb
      additional_contexts:
        certs: ./docker/certs
    environment:
      BACKEND_UPSTREAM: backend:8080
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
